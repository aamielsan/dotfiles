# Options
set -g mouse on
set -g focus-events on  # lets Neovim notice files changed outside it
set -g extended-keys on # pass keys like C-Enter / C-, through to Neovim
set -g mode-keys vi
set -g clock-mode-style 12
set -g status-left '#{?client_prefix,#[reverse],}[#{session_name}]#[noreverse] ' # session name flips colour while the prefix is held
set -g status-position top # Ghostty puts its spare pixels below the last row; at the bottom they padded the bar

# Prefix: C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Panes: vim-style navigation, splits open in the current directory
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
unbind %
unbind '"'
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind q kill-pane
bind t command-prompt -p "(pane-title)" 'select-pane -T "%%"'

# Windows and sessions
bind c command-prompt -p "(new-window)" "new-window -n '%%'"
bind C-q kill-session -a # kill all other sessions

# Copy mode. y copies to the system clipboard through the terminal (OSC 52).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Open the pane's scrollback in Neovim (relative numbers, motions, search, yank)
bind v capture-pane -J -S - -b scrollback \; display-popup -E -w 90% -h 90% "tmux save-buffer -b scrollback - | nvim -c 'normal G' -; tmux delete-buffer -b scrollback"

# Clear screen and history
bind C-k send-keys -R \; send-keys C-l \; clear-history
