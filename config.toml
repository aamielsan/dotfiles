# Shared setup for every machine. Apply with `mise bootstrap`.
# Machine-specific extras live in config.<env>.toml, selected per machine in
# miserc.local.toml (e.g. env = ["work"]). See README.md.

[tools]
# Runtimes
node = "lts"
java = "corretto-25"
python = "3"
go = "latest"
uv = "latest"

# CLI
ripgrep = "latest"
fd = "latest"
fzf = "latest"
zoxide = "latest"
jq = "latest"
gh = "latest"
tmux = "latest"
neovim = "latest"
tree-sitter = "latest" # nvim-treesitter compiles parsers with it
claude = "latest"

# Containers: `colima start` runs the Docker engine in a VM when needed
colima = "latest"
lima = "latest"
docker-cli = "latest"
"github:docker/buildx" = { version = "latest", bin = "docker-buildx" }

# GUI apps from Homebrew's cask catalogue (Homebrew itself isn't installed).
# adopt = true keeps an app that's already in /Applications instead of
# reinstalling it, so macOS doesn't drop its permissions.
[bootstrap.packages]
"brew-cask:ghostty" = { adopt = true }
"brew-cask:google-chrome" = { adopt = true }
"brew-cask:intellij-idea" = { adopt = true }
"brew-cask:karabiner-elements" = { adopt = true } # Caps Lock: hold for Ctrl, tap for Esc
"brew-cask:slack" = { adopt = true }

[bootstrap.directories."~/.ssh"]
mode = "0700"

[bootstrap.directories."~/Desktop/Screenshots"]

[bootstrap.directories."~/workspace/personal"]

[bootstrap.repos]
"~/.config/nvim" = { url = "https://github.com/aamielsan/nvim.git" }

# Symlinks: target = source (relative to this directory)
[dotfiles]
"~/.zprofile" = "home/.zprofile"
"~/.zshrc" = "home/.zshrc"
"~/.zimrc" = "home/.zimrc"
"~/.gitconfig" = "home/.gitconfig"
"~/.config/git" = "home/.config/git"
"~/.tmux.conf" = "home/.tmux.conf"
"~/.ideavimrc" = "home/.ideavimrc"
"~/.config/ghostty/config.ghostty" = "home/.config/ghostty/config.ghostty"
"~/.config/karabiner/assets/complex_modifications/caps-lock.json" = "home/.config/karabiner/assets/complex_modifications/caps-lock.json"
"~/.ssh/config" = "home/.ssh/config"

# Docker finds CLI plugins in ~/.docker/cli-plugins. A hook rather than a
# [dotfiles] entry because dotfiles are linked before tools are installed.
# Re-run `mise bootstrap` after `mise upgrade` to repoint it.
[bootstrap.hooks]
post-tools = 'mkdir -p ~/.docker/cli-plugins && ln -sfn "$("$HOME/.local/bin/mise" where github:docker/buildx)/docker-buildx" ~/.docker/cli-plugins/docker-buildx'

[bootstrap.macos.finder]
show_all_files = true

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"com.apple.screencapture" = { type = "png", location = "~/Desktop/Screenshots" }
"com.apple.AppleMultitouchTrackpad" = { TrackpadRightClick = true }
"com.apple.driver.AppleBluetoothMultitouch.trackpad" = { TrackpadRightClick = true }

# Turn off macOS's Ctrl-Space "select previous input source" (hotkey 60) so
# Ctrl-Space reaches tmux as the prefix.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["60"]
value = { enabled = false, value = { parameters = [32, 49, 262144], type = "standard" } }
